spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: dididi-booking-platform
  profiles:
    active: dev,local
  datasource:
    url: jdbc:mysql://localhost:3306/booking?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&allowPublicKeyRetrieval=true&useSSL=false
    username: booking
    password: ${DB_PASSWORD:booking_dev_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update          # CHI dung cho dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
  # Boot 3.x: property nam duoi spring.data.redis
  data:
    redis:
      host: localhost
      port: 6379
  thymeleaf:
    cache: false
    encoding: UTF-8
  messages:
    basename: i18n/messages,i18n/booking,i18n/error
    encoding: UTF-8
    cache-duration: 0           # dev only
  session:
    timeout: 30m
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ngotrungdientdt@gmail.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:162637437619-hmrebs48150iuvoomplt650ugo7tpg00.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile,email

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # Dev secret - PROD lay tu ENV (xem application-prod.yml). Toi thieu 32 bytes cho HS256.
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-a-long-random-string-min-32-bytes}
    access-token-minutes: 60
    issuer: dididi-booking-platform
    refresh-token-days: 7
  # ---- VNPay sandbox (Phase 8a). Lay tmn-code + hash-secret tu dang ky sandbox tai sandbox.vnpayment.vn ----
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
    version: "2.1.0"
    command: pay
    order-type: other
    locale: vn
  # ---- Integration (Phase 1.5): pull tu flight-provider + hotel-pms ----
  integration:
    flight-provider:
      endpoint: http://localhost:8081/api
      api-key: ${FLIGHT_PROVIDER_API_KEY:dev-flight-key-12345}
    hotel-pms:
      endpoint: http://localhost:8082/api/pms/v1
      api-key: ${HOTEL_PMS_API_KEY:dev-pms-key-67890}
  # ---- Email (Phase Dot1 #2). from nen trung MAIL_USERNAME (Gmail se tu rewrite From). ----
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:Dididi <ngotrungdientdt@gmail.com>}
  # ---- Caching @Cacheable (Dot1 #4). TTL cho API doc hotel/flight tren Redis. Khong khai -> mac dinh 10 phut. ----
  cache:
    ttl-minutes: 10
  # ---- Rate limit (Dot1 #4). Gioi han /api/auth/* theo IP (token bucket). Khong khai -> mac dinh 10 req/phut. ----
  rate-limit:
    auth:
      requests-per-minute: 10
  # ---- Refund (Dot2 Super Admin). Hoan tien > nguong nay can SuperAdmin duyet (<= nguong: Admin duyet). ----
  refund:
    super-admin-threshold: 100000
  # ---- Tro ly CSKH (Dot3). Hybrid: tri thuc noi bo (KB) truoc, LLM sau NEU co api-key. ----
  # De api-key trong (mac dinh) -> CHI dung KB, chay offline, khong goi mang. Co key -> cau hoi la moi nho LLM.
  support:
    llm:
      provider: ${SUPPORT_LLM_PROVIDER:openai}   # openai | anthropic
      api-key: ${SUPPORT_LLM_API_KEY:}           # de trong -> tat nhanh LLM (chi dung KB)
      model: ${SUPPORT_LLM_MODEL:gpt-4o-mini}    # openai: gpt-4o-mini | anthropic: claude-3-5-haiku-latest

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info

resilience4j:
  retry:
    instances:
      flightProvider:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      hotelPms:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      flightProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      hotelPms:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
