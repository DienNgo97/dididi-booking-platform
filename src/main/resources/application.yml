spring:
  servlet:
    multipart:
      max-file-size: 80MB          # cho phep video ngan (Cong dong); anh van bi chan 8MB tai service
      max-request-size: 300MB
  application:
    name: dididi-booking-platform
  profiles:
    active: dev,local
  datasource:
    url: jdbc:mysql://localhost:3306/booking?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&allowPublicKeyRetrieval=true&useSSL=false
    username: booking
    password: ${DB_PASSWORD:booking_dev_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update          # CHI dung cho dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
  # Boot 3.x: property nam duoi spring.data.redis
  data:
    redis:
      host: localhost
      port: 6379
  thymeleaf:
    cache: false
    encoding: UTF-8
    servlet:
      # Render xong HOAN TOAN roi moi ghi ra response (khong stream tung phan).
      # Ly do: trang co nav lon (>8KB) se lam Tomcat commit response giua chung;
      # den luc gap <form th:action> can sinh CSRF token -> phai tao session moi ->
      # "Cannot create a session after the response has been committed" -> trang loi
      # nua voi (khach truy cap LAN DAU vao /forgot-password, /login, /register).
      # Tat streaming cung giup loi template tra ve trang 500 dung chuan thay vi HTML cut.
      produce-partial-output-while-processing: false
  messages:
    basename: i18n/messages,i18n/booking,i18n/error
    encoding: UTF-8
    cache-duration: 0           # dev only
  session:
    timeout: 30m
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ngotrungdientdt@gmail.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:162637437619-hmrebs48150iuvoomplt650ugo7tpg00.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile,email

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # ---- Toi uu hieu nang: nen gzip response (HTML/JSON nho di 5-10 lan khi truyen) ----
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  # ---- Google Maps (Nhom 2). De API key (browser key) trong application-local.yml, KHONG commit. ----
  #   app.maps.api-key: AIza...    hoac bien moi truong GOOGLE_MAPS_API_KEY
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  jwt:
    # Dev secret - PROD lay tu ENV (xem application-prod.yml). Toi thieu 32 bytes cho HS256.
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-a-long-random-string-min-32-bytes}
    access-token-minutes: 60
    issuer: dididi-booking-platform
    refresh-token-days: 7
  # ---- Thanh toan thu (dev/kiem thu): xac nhan don ma KHONG qua cong thanh toan ----
  # Bat de dot kiem thu khong bi chan khi VNPay sandbox truc trac (16/8: VNPay tra code 71).
  # BUOC PHAI la false o production -> da ep cung trong application-prod.yml.
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
  # ---- Ví vendor (VW, 19/08): rút doanh thu sau hoa hồng ----
  # ---- Đối soát công nợ B2B với đối tác API (ST, 27/08) ----
  settlement:
    flight-commission-rate: 0.05   # nền tảng giữ 5% mỗi vé, phần còn lại là công nợ trả hãng
  # ---- Duyệt chi ngân sách doanh nghiệp (P1-3, 28/08) ----
  approval:
    # Đơn B2B vượt ngưỡng phải chờ người duyệt, không thể xong trong 20' như khách lẻ.
    # Giữ chỗ tối đa ngần này giờ; quá thì huỷ đơn VÀ tự đóng yêu cầu duyệt.
    hold-hours: ${APPROVAL_HOLD_HOURS:72}
  payout:
    # Mock "ngân hàng" tự chi REQUESTED->PAID sau vài giây (dev/demo). Prod ÉP false -> admin xử lý tay.
    mock-enabled: ${PAYOUT_MOCK_ENABLED:true}
    mock-fail-percent: 5          # ~5% giao dịch giả lập thất bại để demo nhánh lỗi
    min-amount: 500000            # rút tối thiểu 500k/lần
  # ---- VNPay sandbox (Phase 8a). Lay tmn-code + hash-secret tu dang ky sandbox tai sandbox.vnpayment.vn ----
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
    version: "2.1.0"
    command: pay
    order-type: other
    locale: vn
    # API truy van ket qua giao dich (querydr) — dung de DOI SOAT CHU DONG.
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    # Tu hoi VNPay ve cac giao dich con treo, thay vi ngoi cho VNPay goi vao.
    # Chay duoc ca o localhost (chieu goi RA luon thong) -> khong phai doi config khi len production.
    reconcile-enabled: ${VNPAY_RECONCILE_ENABLED:true}
  # ---- Integration (Phase 1.5): pull tu flight-provider + hotel-pms ----
  integration:
    flight-provider:
      endpoint: http://localhost:8081/api
      api-key: ${FLIGHT_PROVIDER_API_KEY:dev-flight-key-12345}
    hotel-pms:
      endpoint: http://localhost:8082/api/pms/v1
      api-key: ${HOTEL_PMS_API_KEY:dev-pms-key-67890}
  # ---- Email (Phase Dot1 #2). from nen trung MAIL_USERNAME (Gmail se tu rewrite From). ----
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:Dididi <ngotrungdientdt@gmail.com>}
  # ---- Caching @Cacheable (Dot1 #4). TTL cho API doc hotel/flight tren Redis. Khong khai -> mac dinh 10 phut. ----
  cache:
    ttl-minutes: 10
  # ---- Push notification (FCM) cho app mobile. Bat khi co service-account JSON (Firebase). ----
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:false}
    credentials-path: ${APP_FIREBASE_CREDENTIALS:}
  # ---- Tim kiem khach san bang MEILISEARCH (full-text khong dau + typo tolerance). ----
  #      MySQL van la nguon su that; Meilisearch chi la index doc, dong bo 1 chieu (HotelSearchIndexer).
  #      Tat co / Meili chet -> tu fallback ve MySQL LIKE, khong gay loi trang.
  search:
    enabled: ${APP_SEARCH_ENABLED:false}
    host: ${APP_SEARCH_HOST:http://localhost:7700}
    api-key: ${APP_SEARCH_API_KEY:}
  # ---- CORS (SEC-06). Origin cho Angular/Flutter goi /api/**. CSV nhieu origin. Prod set domain that.
  #      allowCredentials=true nen KHONG dung "*" — liet ke origin cu the. ----
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # ---- Rate limit (Dot1 #4). Gioi han /api/auth/* theo IP (token bucket). Khong khai -> mac dinh 10 req/phut. ----
  #      trust-forwarded-for=false: lay IP tu getRemoteAddr() (chong gia mao X-Forwarded-For). Chi bat khi
  #      chay sau proxy/LB tin cay (SEC-07). ----
  rate-limit:
    auth:
      requests-per-minute: 10
    trust-forwarded-for: ${APP_RATE_LIMIT_TRUST_XFF:false}
  # ---- Refund (Dot2 Super Admin). Hoan tien >= nguong nay (VND) can SuperAdmin duyet (< nguong: Admin duyet). ----
  #      Day la NGUON SU THAT DUY NHAT cho nguong. Default trong code (5_000_000) khop policy va chi la
  #      fallback an toan neu key bi xoa (khong lat ngam ve 0 hay 10tr). ----
  refund:
    super-admin-threshold: 5000000
  # ---- Tro ly CSKH (Dot3). Hybrid: tri thuc noi bo (KB) truoc, LLM sau NEU co api-key. ----
  # De api-key trong (mac dinh) -> CHI dung KB, chay offline, khong goi mang. Co key -> cau hoi la moi nho LLM.
  support:
    llm:
      provider: ${SUPPORT_LLM_PROVIDER:openai}   # openai | anthropic (openai = moi API noi chuan OpenAI)
      api-key: ${SUPPORT_LLM_API_KEY:}           # de trong -> tat nhanh LLM (chi dung KB)
      model: ${SUPPORT_LLM_MODEL:gpt-4o-mini}    # openai: gpt-4o-mini | anthropic: claude-3-5-haiku-latest
      # base-url: doi sang dich vu MIEN PHI noi chuan OpenAI (dung chung cho chatbot CSKH + AI Trip Guide):
      #   Gemini free: https://generativelanguage.googleapis.com/v1beta/openai  (model: gemini-2.5-flash)
      #   Groq free  : https://api.groq.com/openai/v1                           (model: llama-3.3-70b-versatile)
      #   Ollama local: http://localhost:11434/v1                               (model: qwen2.5:7b, api-key: ollama)
      base-url: ${SUPPORT_LLM_BASE_URL:https://api.openai.com/v1}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info

resilience4j:
  retry:
    instances:
      flightProvider:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      hotelPms:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      flightProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      hotelPms:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
