# ==== Chatbot KB answers ====
kb.cancel=在距离入住/出发还有超过 48 小时时，您可以自助取消订单（酒店或机票）：进入"我的订单"→打开订单→"申请取消"。管理员审核通过后，将按您支付的金额全额退款。在 48 小时以内无法在线取消，请联系客服处理。
kb.deadline=免费取消的期限是入住（酒店）或出发（机票）前 48 小时。超过 48 小时：可在"我的订单"中自助取消。48 小时以内：需联系客服，我可以为您转接人工客服。
kb.refund=取消申请经管理员审核通过后，将按您为订单支付的金额全额退款。到账时间取决于银行/支付网关（通常为几个工作日）。您可在订单详情中查看取消/退款状态。
kb.change=对于直接预订的酒店（尚未支付），您可以在订单详情的"修改"中更改日期/时间/房间数，系统会重新计算价格。机票和合作伙伴订单无法直接修改；如需更改，请取消（在超过 48 小时的情况下）后重新预订，或联系客服。
kb.payment=Dididi 支持通过 VNPay 在线支付（国内/国际银行卡、二维码）。下单后，在订单详情中点击"继续支付"。订单仅在支付成功后才会确认。
kb.points=每完成一笔订单都会获得积分；积分可兑换折扣券。会员等级（银卡/金卡/白金/钻石）随消费增长并提供专属优惠。请在账户的"积分奖励"页面查看积分和等级。
kb.lookup=您的所有订单都在"我的订单"中（右上角账户菜单）。每笔订单都有形如 DD-xxxxx 的订单号；点击即可查看详情、支付、取消或下载发票。
kb.baggage=预订机票时，在填写每位乘客信息的步骤中，您可以加购餐食和托运行李（需额外付费，计入总价）。标准随身行李通常已按舱位包含。
kb.checkin=标准入住时间为 14:00，退房时间为 12:00（适用于过夜预订）。按小时（日间使用）预订则按您下单时选择的时间段。
kb.hotline=我来为您转接人工客服——请点击下方的"联系客服"，由我们的工作人员直接为您提供帮助。
kb.greeting=您好 我是 Dididi 的助手。我可以帮您处理取消、退款、改期、付款、积分等问题……请问需要什么帮助？
kb.thanks=很高兴能帮到您！如还有需要，随时给我留言。祝您旅途愉快
kb.empty=请输入您的问题，例如"如何取消订单？"或"退款政策"。
kb.none=抱歉，这个问题我不太确定。您想转接人工客服获得直接帮助吗？

