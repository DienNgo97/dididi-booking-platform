# ==== Chatbot KB answers ====
kb.cancel=Bạn có thể TỰ HUỶ đơn (khách sạn hoặc vé máy bay) khi còn HƠN 48 giờ trước giờ nhận phòng / giờ khởi hành: vào "Đơn của tôi" → mở đơn → "Yêu cầu huỷ đơn". Khi admin duyệt, bạn được hoàn lại đúng số tiền đã thanh toán. Trong vòng 48 giờ, hệ thống không cho huỷ trực tuyến — bạn vui lòng liên hệ hỗ trợ để được xử lý.
kb.deadline=Mốc huỷ miễn phí là 48 giờ trước giờ nhận phòng (khách sạn) hoặc giờ khởi hành (vé máy bay). Còn >48 giờ: tự huỷ trong "Đơn của tôi". Trong 48 giờ: cần liên hệ hỗ trợ, mình có thể chuyển bạn tới tổng đài viên.
kb.refund=Khi yêu cầu huỷ được admin duyệt, bạn được hoàn lại đúng số tiền đã thanh toán cho đơn. Thời gian tiền về tuỳ ngân hàng/cổng thanh toán (thường vài ngày làm việc). Bạn xem trạng thái huỷ/hoàn ngay trong chi tiết đơn.
kb.change=Với khách sạn đặt trực tiếp (chưa thanh toán), bạn có thể đổi ngày/giờ/số phòng trong chi tiết đơn (mục "Chỉnh sửa") — hệ thống tính lại giá. Vé máy bay và đơn đối tác không sửa trực tiếp; bạn cần huỷ (nếu còn >48h) rồi đặt lại, hoặc liên hệ hỗ trợ.
kb.payment=Dididi hỗ trợ thanh toán online qua VNPay (thẻ nội địa/quốc tế, QR). Sau khi đặt, bạn bấm "Tiếp tục thanh toán" trong chi tiết đơn. Đơn chỉ được xác nhận sau khi thanh toán thành công.
kb.points=Mỗi đơn hoàn tất sẽ được tích điểm; điểm dùng để đổi voucher giảm giá. Hạng thành viên (Bạc/Vàng/Bạch kim/Kim cương) tăng theo chi tiêu và cho ưu đãi riêng. Xem điểm và hạng tại trang "Điểm thưởng" trong tài khoản.
kb.lookup=Tất cả đơn của bạn nằm ở "Đơn của tôi" (menu tài khoản góc phải). Mỗi đơn có mã dạng DD-xxxxx; bấm vào để xem chi tiết, thanh toán, huỷ hoặc tải hoá đơn.
kb.baggage=Khi đặt vé, ở bước nhập thông tin từng hành khách bạn có thể chọn thêm suất ăn và hành lý ký gửi (có phụ phí, cộng vào tổng tiền). Hành lý xách tay tiêu chuẩn thường đã bao gồm theo hạng vé.
kb.checkin=Giờ nhận phòng tiêu chuẩn là 14:00 và trả phòng 12:00 (với đặt qua đêm). Đặt theo giờ (trong ngày) thì theo khung giờ bạn chọn khi đặt.
kb.hotline=Mình kết nối bạn tới tổng đài viên nhé — bấm "Gặp tổng đài viên" bên dưới để được nhân viên hỗ trợ trực tiếp.
kb.greeting=Chào bạn Mình là trợ lý của Dididi. Mình có thể giúp về huỷ đơn, hoàn tiền, đổi lịch, thanh toán, điểm thưởng... Bạn cần hỗ trợ gì ạ?
kb.thanks=Rất vui được hỗ trợ bạn! Nếu cần thêm gì, bạn cứ nhắn mình nhé. Chúc bạn có chuyến đi vui vẻ
kb.empty=Bạn nhập câu hỏi giúp mình nhé, ví dụ "làm sao huỷ đơn?" hoặc "chính sách hoàn tiền".
kb.none=Xin lỗi, câu này mình chưa chắc chắn. Bạn có muốn gặp tổng đài viên để được hỗ trợ trực tiếp không?

