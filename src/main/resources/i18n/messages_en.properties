# ==== Chatbot KB answers ====
kb.cancel=You can cancel a booking (hotel or flight) yourself when there are MORE THAN 48 hours before check-in / departure: go to "My bookings" → open the booking → "Request cancellation". Once an admin approves, you are refunded exactly what you paid. Within 48 hours, online cancellation is disabled — please contact support for help.
kb.deadline=The free-cancellation deadline is 48 hours before check-in (hotel) or departure (flight). More than 48 hours: cancel yourself in "My bookings". Within 48 hours: please contact support — I can connect you to an agent.
kb.refund=Once your cancellation is approved by an admin, you are refunded exactly what you paid for the booking. The time for the money to arrive depends on your bank/payment gateway (usually a few business days). You can track the cancellation/refund status in the booking details.
kb.change=For directly-booked hotels (not yet paid), you can change the dates/time/number of rooms in the booking details ("Edit" section) — the system recalculates the price. Flights and partner bookings cannot be edited directly; you need to cancel (if more than 48h remain) and rebook, or contact support.
kb.payment=Dididi supports online payment via VNPay (domestic/international cards, QR). After booking, click "Continue to payment" in the booking details. A booking is only confirmed after successful payment.
kb.points=Every completed booking earns points; points can be redeemed for discount vouchers. Membership tiers (Silver/Gold/Platinum/Diamond) rise with your spending and grant special benefits. Check your points and tier on the "Reward points" page in your account.
kb.lookup=All your bookings are under "My bookings" (account menu, top right). Each booking has a code like DD-xxxxx; click it to view details, pay, cancel, or download the invoice.
kb.baggage=When booking a flight, at the per-passenger details step you can add meals and checked baggage (extra fees added to the total). Standard carry-on baggage is usually included with the fare class.
kb.checkin=Standard check-in is 14:00 and check-out is 12:00 (for overnight stays). For hourly (day-use) bookings, it follows the time slot you choose when booking.
kb.hotline=Let me connect you to an agent — click "Talk to an agent" below to get help directly from our staff.
kb.greeting=Hi there I'm Dididi's assistant. I can help with cancellations, refunds, rescheduling, payments, reward points... How can I help?
kb.thanks=Glad to help! If you need anything else, just message me. Have a great trip
kb.empty=Please type your question, for example "how do I cancel a booking?" or "refund policy".
kb.none=Sorry, I'm not sure about this one. Would you like to talk to an agent for direct help?

