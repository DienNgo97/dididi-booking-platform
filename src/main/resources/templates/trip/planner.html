<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{trip.pageTitle}">Trip Planner - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap" style="max-width:560px">
    <h1 th:text="#{trip.title}">Trip Planner</h1>
    <p class="muted" th:text="#{trip.subtitle}">Nhập điểm đến, Dididi gợi ý chuyến bay + khách sạn phù hợp.</p>
    <form action="/trip-planner/suggest" method="get" class="card">
        <label class="muted" th:text="#{trip.dest}">Điểm đến (thành phố)</label><br/>
        <input type="text" name="city" th:placeholder="#{trip.destExample}" placeholder="VD: Da Nang, Ha Noi, TP.HCM" required
               style="width:100%;padding:9px;border:1px solid #cdd3dd;border-radius:8px;margin-bottom:10px"/>
        <label class="muted" th:text="#{trip.fromLabel}">Đi từ sân bay (tuỳ chọn)</label><br/>
        <input type="text" name="from" th:placeholder="#{trip.fromExample}" placeholder="VD: HAN"
               style="width:100%;padding:9px;border:1px solid #cdd3dd;border-radius:8px;margin-bottom:14px"/>
        <button class="btn" type="submit" th:text="#{trip.submit}">Gợi ý chuyến đi</button>
    </form>
</div>
</body>
</html>
