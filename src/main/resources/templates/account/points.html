<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{points.title}">Điểm thưởng - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap" style="max-width:640px">
    <div th:replace="~{fragments/site :: flash}"></div>
    <h1 th:text="#{points.title}">Điểm thưởng</h1>

    <div class="card">
        <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:baseline">
            <div>
                <div class="muted" th:text="#{points.balance}">Số dư điểm</div>
                <div class="price" style="font-size:28px" th:text="${balance} + ' ' + #{points.unit}">0 điểm</div>
            </div>
            <div>
                <div class="muted" th:text="#{points.tier}">Hạng</div>
                <div style="font-weight:700;font-size:18px" th:text="${tier}">BRONZE</div>
            </div>
            <div>
                <div class="muted" th:text="#{points.earned}">Tổng điểm đã tích</div>
                <div style="font-weight:600" th:text="${lifetimeEarned}">0</div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:12px">
        <h3 style="margin-top:0" th:text="#{points.redeem}">Đổi điểm lấy voucher</h3>
        <p class="muted" th:text="#{points.redeemNote(${minRedeem}, ${redeemPointValue})}">Tối thiểu ... điểm.</p>
        <form th:action="@{/account/points/redeem}" method="post" style="display:flex;gap:8px">
            <input type="number" name="points" th:min="${minRedeem}" th:step="${minRedeem}" th:value="${minRedeem}" required
                   style="width:150px;padding:8px;border:1px solid #cdd3dd;border-radius:8px"/>
            <button class="btn" type="submit" th:text="#{points.redeemBtn}">Đổi</button>
        </form>
    </div>

    <div class="card" style="margin-top:12px">
        <h3 style="margin-top:0" th:text="#{points.history}">Lịch sử điểm</h3>
        <p class="muted" th:if="${#lists.isEmpty(history)}" th:text="#{points.empty}">Chưa có giao dịch điểm.</p>
        <table class="tbl" th:if="${!#lists.isEmpty(history)}">
            <thead>
            <tr><th th:text="#{points.cDate}">Ngày</th><th th:text="#{points.cType}">Loại</th>
                <th th:text="#{points.cPoints}">Điểm</th><th th:text="#{points.cDesc}">Mô tả</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${history}">
                <td class="muted" th:text="${t.createdAt}">--</td>
                <td th:switch="${t.type.name()}">
                    <span th:case="'EARN'" th:text="#{points.t.EARN}">Tích</span>
                    <span th:case="'REDEEM'" th:text="#{points.t.REDEEM}">Đổi</span>
                    <span th:case="*" th:text="#{points.t.ADJUST}">Điều chỉnh</span>
                </td>
                <td th:text="${t.points > 0 ? '+' + t.points : t.points}"
                    th:style="${t.points >= 0} ? 'color:#2e7d32;font-weight:600' : 'color:#c0392b;font-weight:600'">+0</td>
                <td class="muted" th:text="${t.description}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
