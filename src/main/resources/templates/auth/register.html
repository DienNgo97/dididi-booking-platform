<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{auth.registerTitle}">Đăng ký - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="authbox">
    <h1 th:text="#{nav.register}">Đăng ký</h1>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <label th:text="#{auth.fullName}">Họ tên</label>
        <input type="text" name="fullName"/>
        <label th:text="#{auth.email}">Email</label>
        <input type="email" name="email" required/>
        <label th:text="#{auth.password}">Mật khẩu</label>
        <input type="password" name="password" required/>
        <div style="margin-top:18px"><button class="btn" type="submit" style="width:100%" th:text="#{auth.createAccount}">Tạo tài khoản</button></div>
    </form>
    <p class="muted" style="margin-top:14px"><span th:text="#{auth.haveAccount}">Đã có tài khoản?</span> <a href="/login" th:text="#{nav.login}">Đăng nhập</a></p>
    <p class="muted" style="margin-top:6px"><span th:text="#{auth.areYouHotelOwner}">Bạn là chủ khách sạn?</span> <a href="/vendor-register" th:text="#{auth.vendorRegister}">Đăng ký bán phòng</a></p>
</div>
</body>
</html>
