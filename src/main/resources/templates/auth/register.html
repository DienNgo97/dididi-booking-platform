<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{auth.registerTitle}">Đăng ký - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="authbox">
    <h1 th:text="#{nav.register}">Đăng ký</h1>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>
    <form id="regForm" th:action="@{/register}" method="post">
        <label th:text="#{auth.fullName}">Họ tên</label>
        <input type="text" name="fullName" th:value="${fullName}"/>
        <label th:text="#{auth.email}">Email</label>
        <input type="email" name="email" required th:value="${email}"/>
        <label th:text="#{auth.password}">Mật khẩu</label>
        <input type="password" name="password" id="pw" required minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
               title="Tối thiểu 8 ký tự, gồm chữ in hoa, chữ thường, số và ký tự đặc biệt" th:attr="title=#{auth.passwordRule}"/>
        <label th:text="#{auth.confirmPassword}">Nhập lại mật khẩu</label>
        <input type="password" name="confirmPassword" id="cpw" required th:attr="data-mismatch=#{auth.pwMismatch}"/>
        <p class="muted" style="margin-top:8px;font-size:13px" th:text="#{auth.passwordHint}">
            Mật khẩu tối thiểu 8 ký tự, gồm ít nhất 1 chữ in hoa, 1 chữ thường, 1 số và 1 ký tự đặc biệt.
        </p>
        <div style="margin-top:18px"><button class="btn" type="submit" style="width:100%" th:text="#{auth.createAccount}">Tạo tài khoản</button></div>
    </form>
    <div style="text-align:center;margin:14px 0;color:#9aa3af" th:text="#{auth.or}">hoặc</div>
    <a class="btn ghost" href="/oauth2/authorization/google"
       style="width:100%;display:block;text-align:center;box-sizing:border-box;text-decoration:none"
       th:text="#{auth.googleSignup}">Đăng ký với Google</a>
    <p class="muted" style="margin-top:14px"><span th:text="#{auth.haveAccount}">Đã có tài khoản?</span> <a href="/login" th:text="#{nav.login}">Đăng nhập</a></p>
    <p class="muted" style="margin-top:6px"><span th:text="#{auth.areYouHotelOwner}">Bạn là chủ khách sạn?</span> <a href="/vendor-register" th:text="#{auth.vendorRegister}">Đăng ký bán phòng</a></p>

    <p class="muted" style="font-size:12px;margin-top:14px;line-height:1.6" th:utext="#{register.terms}">
        Khi đăng ký, tôi đồng ý với các
        <a href="/terms" target="_blank" rel="noopener">Điều khoản sử dụng</a>
        và
        <a href="/privacy" target="_blank" rel="noopener">Chính sách bảo mật</a>
        của Dididi.
    </p>
</div>
<script>
  (function () {
    var p = document.getElementById('pw'), c = document.getElementById('cpw');
    function check() { c.setCustomValidity(p.value !== c.value ? (c.getAttribute('data-mismatch') || 'Mật khẩu nhập lại không khớp') : ''); }
    if (p && c) { p.addEventListener('input', check); c.addEventListener('input', check); }
  })();
</script>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
