<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{auth.forgotTitle}">Quên mật khẩu - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="authbox">
    <h1 th:text="#{auth.forgot}">Quên mật khẩu</h1>
    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <p class="muted" th:text="#{auth.forgotIntro}">Nhập email đã đăng ký. Chúng tôi sẽ gửi liên kết để bạn đặt lại mật khẩu.</p>
    <form th:action="@{/forgot-password}" method="post">
        <label th:text="#{auth.email}">Email</label>
        <input type="email" name="email" required autofocus/>
        <div style="margin-top:18px"><button class="btn" type="submit" style="width:100%" th:text="#{auth.sendResetLink}">Gửi liên kết đặt lại</button></div>
    </form>
    <p class="muted" style="margin-top:14px"><a href="/login" th:text="#{auth.backToLogin}">Quay lại đăng nhập</a></p>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
