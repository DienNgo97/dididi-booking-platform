<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{auth.resetTitle}">Đặt lại mật khẩu - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="authbox">
    <h1 th:text="#{auth.reset}">Đặt lại mật khẩu</h1>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>

    <div th:if="${!tokenValid}">
        <p class="flash err" th:text="#{auth.resetInvalidLink}">Liên kết không hợp lệ hoặc đã hết hạn.</p>
        <p class="muted" style="margin-top:14px"><a href="/forgot-password" th:text="#{auth.requestNewLink}">Yêu cầu liên kết mới</a></p>
    </div>

    <form th:if="${tokenValid}" id="resetForm" th:action="@{/reset-password}" method="post" th:attr="data-mismatch=#{auth.pwMismatch}">
        <input type="hidden" name="token" th:value="${token}"/>
        <label th:text="#{auth.newPassword}">Mật khẩu mới</label>
        <input type="password" name="password" id="pw" required minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
               th:title="#{auth.passwordRule}" title="Tối thiểu 8 ký tự, gồm chữ in hoa, chữ thường, số và ký tự đặc biệt"/>
        <label th:text="#{auth.confirmNewPassword}">Nhập lại mật khẩu mới</label>
        <input type="password" name="confirmPassword" id="cpw" required/>
        <p class="muted" style="margin-top:8px;font-size:13px" th:text="#{auth.passwordHint}">
            Mật khẩu tối thiểu 8 ký tự, gồm ít nhất 1 chữ in hoa, 1 chữ thường, 1 số và 1 ký tự đặc biệt.
        </p>
        <div style="margin-top:18px"><button class="btn" type="submit" style="width:100%" th:text="#{auth.changePassword}">Đổi mật khẩu</button></div>
    </form>
</div>
<script>
  (function () {
    var p = document.getElementById('pw'), c = document.getElementById('cpw');
    var form = document.getElementById('resetForm');
    var msg = (form && form.getAttribute('data-mismatch')) || 'Mật khẩu nhập lại không khớp';
    function check() { c.setCustomValidity(p.value !== c.value ? msg : ''); }
    if (p && c) { p.addEventListener('input', check); c.addEventListener('input', check); }
  })();
</script>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
