<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Loader bản đồ cho WEB: Leaflet + OpenStreetMap (miễn phí, KHÔNG cần API key/billing).
  (Trước đây dùng Google Maps JS API nhưng Maps Platform chặn "Permission Denied" cấp tài khoản
   billing — app MOBILE vẫn dùng Google Maps SDK với key riêng, không liên quan.)
  Tham số: callback = tên hàm window được gọi khi Leaflet sẵn sàng.
  Cách dùng (giữ nguyên như cũ):
    <th:block th:replace="~{fragments/maps :: loader('initHotelMap')}"></th:block>
-->
<th:block th:fragment="loader(callback)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script th:inline="javascript">
    (function () {
      var cb = /*[[${callback}]]*/ '';
      function fire() { if (cb && typeof window[cb] === 'function') window[cb](); }
      if (window.L) { fire(); return; }
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      s.onload = fire;
      document.head.appendChild(s);
    })();
  </script>
</th:block>
</body>
</html>
