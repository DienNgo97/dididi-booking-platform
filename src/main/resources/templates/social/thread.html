<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{community.dm.chatWith(${other.name})}">Tin nhắn</title>
    <link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('messages')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('messages')}"></div>
        <main class="sx-main sx-dmmain">
            <div class="dm-layout">
                <div th:replace="~{social/dm-fragments :: convList}"></div>

                <section class="dm-thread">
                    <header class="dm-thread-head">
                        <a href="/community/messages" class="sx-iconbtn dm-back" th:title="#{community.dm.inbox}"><svg th:replace="~{fragments/icons :: i('arrow-left','')}"></svg></a>
                        <a th:href="${other.profileUrl}" class="sx-ava sm" aria-hidden="true">
                            <img th:if="${other.avatarUrl}" th:src="${other.avatarUrl}" alt=""/>
                            <span th:unless="${other.avatarUrl}" class="sx-ava-ph" th:classappend="${group} ? 'grp' : ''" th:text="${#strings.toUpperCase(#strings.substring(other.name,0,1))}">D</span>
                        </a>
                        <span class="dm-thread-title">
                            <a th:href="${other.profileUrl}" class="dm-thread-name" th:text="${other.name}">Tên</a>
                            <small th:if="${group}" th:text="#{community.dm.memberCount(${#lists.size(members)})}">3 thành viên</small>
                        </span>
                        <span class="dm-thread-actions">
                            <button th:if="${group}" type="button" class="sx-iconbtn" id="dmGroupToggle"
                                    th:attr="title=#{community.dm.groupInfo},aria-label=#{community.dm.groupInfo}">
                                <svg th:replace="~{fragments/icons :: i('users','')}"></svg>
                            </button>
                            <form th:action="@{'/community/messages/' + ${convId} + '/archive'}" method="post">
                                <input type="hidden" name="on" th:value="${archivedMode} ? 'false' : 'true'"/>
                                <button type="submit" class="sx-iconbtn"
                                        th:attr="title=${archivedMode} ? #{community.dm.unarchive} : #{community.dm.archive},aria-label=${archivedMode} ? #{community.dm.unarchive} : #{community.dm.archive}">
                                    <svg th:replace="~{fragments/icons :: i('archive','')}"></svg>
                                </button>
                            </form>
                            <form th:if="${group}" th:action="@{'/community/messages/' + ${convId} + '/leave'}" method="post">
                                <button type="submit" class="sx-iconbtn danger"
                                        th:attr="data-confirm=#{community.dm.leaveConfirm},title=#{community.dm.leave},aria-label=#{community.dm.leave}">
                                    <svg th:replace="~{fragments/icons :: i('logout','')}"></svg>
                                </button>
                            </form>
                            <form th:unless="${group}" th:action="@{'/community/messages/' + ${convId} + '/delete'}" method="post">
                                <button type="submit" class="sx-iconbtn danger"
                                        th:attr="data-confirm=#{community.dm.deleteConfirm},title=#{community.dm.delete},aria-label=#{community.dm.delete}">
                                    <svg th:replace="~{fragments/icons :: i('trash','')}"></svg>
                                </button>
                            </form>
                        </span>
                    </header>

                    <!-- Bảng quản lý nhóm: ai cũng thêm được thành viên, chỉ chủ nhóm đổi tên / xoá người. -->
                    <div th:if="${group}" id="dmGroupPanel" class="dm-grouppanel" hidden>
                        <form th:if="${owner}" class="dm-grouprow" th:action="@{'/community/messages/' + ${convId} + '/rename'}" method="post">
                            <input type="text" name="title" maxlength="120" th:value="${other.name}" th:placeholder="#{community.dm.groupName}"/>
                            <button type="submit" class="btn ghost sm" th:text="#{community.dm.rename}">Đổi tên</button>
                        </form>
                        <a class="btn ghost sm dm-addbtn" th:href="@{'/community/messages/' + ${convId} + '/add'}">
                            <svg th:replace="~{fragments/icons :: i('user-plus','')}"></svg>
                            <span th:text="#{community.dm.addMember}">Thêm thành viên</span>
                        </a>
                        <p class="dm-grouphint" th:text="#{community.dm.addHint}">Thành viên nào cũng mời thêm được, nhưng chỉ mời được người theo dõi qua lại.</p>
                        <ul class="dm-memberlist">
                            <li th:each="m,st : ${members}">
                                <a th:href="${m.profileUrl}" th:text="${m.name}">Tên</a>
                                <span th:if="${st.index == 0}" class="dm-ownertag" th:text="#{community.dm.owner}">Chủ nhóm</span>
                                <form th:if="${owner and st.index > 0}" th:action="@{'/community/messages/' + ${convId} + '/members/remove'}" method="post">
                                    <input type="hidden" name="userId" th:value="${m.id}"/>
                                    <button type="submit" class="sx-linklike danger"
                                            th:attr="data-confirm=#{community.dm.removeConfirm}" th:text="#{community.action.delete}">Xoá</button>
                                </form>
                            </li>
                        </ul>
                    </div>

                    <div id="dmMessages" class="dm-messages" th:attr="data-conv=${convId},data-last=${lastId}">
                        <div th:replace="~{social/dm-fragments :: messages}"></div>
                    </div>

                    <form id="dmComposer" class="dm-composer" enctype="multipart/form-data">
                        <label class="sx-iconbtn" th:title="#{community.dm.sendImage}">
                            <svg th:replace="~{fragments/icons :: i('image','')}"></svg>
                            <input type="file" name="image" accept="image/*" hidden/>
                        </label>
                        <input type="text" name="content" autocomplete="off" th:placeholder="#{community.dm.inputPh}"/>
                        <button type="submit" class="sx-iconbtn dm-send" th:aria-label="#{community.action.send}"><svg th:replace="~{fragments/icons :: i('send','')}"></svg></button>
                    </form>
                </section>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
<script>
    (function () {
        var gt = document.getElementById('dmGroupToggle');
        var gp = document.getElementById('dmGroupPanel');
        if (gt && gp) { gt.addEventListener('click', function () { gp.hidden = !gp.hidden; }); }
    })();
    (function () {
        var box = document.getElementById('dmMessages');
        if (!box) return;
        var convId = box.getAttribute('data-conv');
        var lastId = parseInt(box.getAttribute('data-last') || '0', 10);
        var csrf = (document.querySelector('meta[name=_csrf]') || {}).content;
        var csrfH = (document.querySelector('meta[name=_csrf_header]') || {}).content;
        function scrollBottom() { box.scrollTop = box.scrollHeight; }
        function appendHtml(html) {
            var tmp = document.createElement('div'); tmp.innerHTML = html;
            Array.prototype.slice.call(tmp.children).forEach(function (n) {
                var id = n.getAttribute ? n.getAttribute('data-id') : null;
                // Khong khoa theo class .dm-msg: dong he thong cua nhom render class .dm-sysline,
                // neu loc theo .dm-msg thi moi tin SYSTEM se lot qua bo chong trung cua poll.
                if (id) { if (box.querySelector('[data-id="' + id + '"]')) return; lastId = Math.max(lastId, parseInt(id, 10)); }
                box.appendChild(n);
            });
            if (window.DDSocial) window.DDSocial.init(box);
            scrollBottom();
        }
        scrollBottom();
        var form = document.getElementById('dmComposer');
        var file = form.querySelector('input[type=file]');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var fd = new FormData(form);
            var H = {}; if (csrf && csrfH) H[csrfH] = csrf;
            fetch('/community/messages/' + convId + '/send', { method: 'POST', body: fd, headers: H, credentials: 'same-origin' })
                .then(function (r) {
                    // Het phien (dang xuat o tab khac): fetch bi redirect ve /login -> chuyen han
                    // sang trang dang nhap, KHONG append HTML trang login vao khung chat.
                    if (sessionGone(r)) return null;
                    return r.text();
                })
                .then(function (h) { if (h != null) { appendHtml(h); form.reset(); } })
                .catch(function () {});
        });
        file.addEventListener('change', function () {
            if (file.files && file.files.length) {
                if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit'));
            }
        });
        // Het phien -> dung poll + dua nguoi dung ve /login (QA TC-B-17: truoc day poll cu chay tiep,
        // request cache luu URL poll, dang nhap lai bi nem vao endpoint du lieu -> trang trang).
        function sessionGone(r) {
            if (r.redirected && r.url.indexOf('/login') >= 0) {
                clearInterval(pollTimer);
                window.location = '/login';
                return true;
            }
            return false;
        }
        var pollTimer = setInterval(function () {
            fetch('/community/messages/' + convId + '/poll?afterId=' + lastId, { credentials: 'same-origin' })
                .then(function (r) {
                    if (sessionGone(r)) return null;
                    return r.text();
                })
                .then(function (h) { if (h && h.trim()) appendHtml(h); })
                .catch(function () {});
        }, 3000);
    })();
</script>
</body>
</html>
