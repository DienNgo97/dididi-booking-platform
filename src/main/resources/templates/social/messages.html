<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{community.title.messages}">Tin nhắn - Cộng đồng Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('messages')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('messages')}"></div>
        <main class="sx-main sx-dmmain">
            <div class="dm-layout dm-inbox-mode">
                <div th:replace="~{social/dm-fragments :: convList}"></div>

                <section class="dm-thread dm-empty">
                    <div class="dm-empty-inner">
                        <span class="dm-empty-ic"><svg th:replace="~{fragments/icons :: i('send','')}"></svg></span>
                        <h3 th:text="#{community.dm.yourMessages}">Tin nhắn của bạn</h3>
                        <p th:utext="#{community.dm.pickHint}">Chọn một cuộc trò chuyện.</p>
                        <a href="/community/people" class="btn sx-dm-start" th:text="#{community.dm.findPeopleLong}">Tìm người để nhắn tin</a>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
