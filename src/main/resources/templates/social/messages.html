<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tin nhắn - Cộng đồng Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('messages')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('messages')}"></div>
        <main class="sx-main sx-dmmain">
            <div class="dm-layout dm-inbox-mode">
                <aside class="dm-list">
                    <div class="dm-list-head">
                        <h2>Tin nhắn</h2>
                        <a href="/community/people" class="sx-iconbtn" title="Nhắn tin mới"><svg th:replace="~{fragments/icons :: i('pencil','')}"></svg></a>
                    </div>
                    <div class="dm-list-body">
                        <div th:if="${#lists.isEmpty(conversations)}" class="dm-list-empty">
                            <p>Chưa có cuộc trò chuyện nào.</p>
                            <a href="/community/people" class="btn ghost">Tìm người để nhắn</a>
                        </div>
                        <a th:each="c : ${conversations}" th:href="${c.url}" class="dm-conv" th:classappend="${c.unread > 0} ? 'unread' : ''">
                            <span class="sx-ava" aria-hidden="true">
                                <img th:if="${c.other.avatarUrl}" th:src="${c.other.avatarUrl}" alt=""/>
                                <span th:unless="${c.other.avatarUrl}" class="sx-ava-ph" th:text="${#strings.toUpperCase(#strings.substring(c.other.name,0,1))}">D</span>
                            </span>
                            <div class="dm-conv-body">
                                <div class="dm-conv-top">
                                    <b th:text="${c.other.name}">Tên</b>
                                    <span class="sx-time" th:attr="data-ts=${c.lastMessageAtMs}"></span>
                                </div>
                                <span class="dm-conv-preview" th:text="${c.preview != null ? c.preview : 'Bắt đầu trò chuyện…'}">tin nhắn cuối</span>
                            </div>
                            <span class="dm-unread" th:if="${c.unread > 0}" th:text="${c.unread}">0</span>
                        </a>
                    </div>
                </aside>

                <section class="dm-thread dm-empty">
                    <div class="dm-empty-inner">
                        <span class="dm-empty-ic"><svg th:replace="~{fragments/icons :: i('send','')}"></svg></span>
                        <h3>Tin nhắn của bạn</h3>
                        <p>Chọn một cuộc trò chuyện ở bên trái để xem, hoặc mở trang cá nhân của ai đó và bấm <b>Nhắn tin</b> để bắt đầu.</p>
                        <a href="/community/people" class="btn sx-dm-start">Tìm người để nhắn tin</a>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
