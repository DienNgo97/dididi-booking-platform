<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{community.title.notifications}">Thông báo - Cộng đồng Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('notif')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('notif')}"></div>
        <main class="sx-main">
            <div class="sx-pagehead">
                <h1 th:text="#{community.nav.notifications}">Thông báo</h1>
                <p th:text="#{community.notif.sub}">Mọi hoạt động liên quan tới bạn.</p>
            </div>
            <div th:if="${#lists.isEmpty(notifications)}" class="sx-empty">
                <span class="sx-empty-ic"><svg th:replace="~{fragments/icons :: i('bell','')}"></svg></span>
                <p th:text="#{community.notif.empty}">Chưa có thông báo nào.</p>
            </div>
            <div class="sx-notiflist">
                <a th:each="n : ${notifications}" th:href="${n.url}" class="sx-notif" th:classappend="${!n.read} ? 'unread' : ''">
                    <span class="sx-ava sm">
                        <img th:if="${n.actor.avatarUrl}" th:src="${n.actor.avatarUrl}" alt=""/>
                        <span th:unless="${n.actor.avatarUrl}" class="sx-ava-ph" th:text="${#strings.toUpperCase(#strings.substring(n.actor.name,0,1))}">D</span>
                    </span>
                    <div class="sx-notif-body">
                        <span><b th:text="${n.actor.name}">Tên</b> <span th:text="${n.message}">đã tương tác</span></span>
                        <span class="sx-time" th:attr="data-ts=${n.createdAtMs}"></span>
                    </div>
                    <span class="sx-notif-dot" th:if="${!n.read}" aria-hidden="true"></span>
                </a>
            </div>
        </main>
        <div th:replace="~{social/fragments :: railRight}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
