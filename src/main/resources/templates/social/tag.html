<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'#' + ${tag} + ' - ' + #{community.brand}">Hashtag</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('')}"></div>
        <main class="sx-main">
            <div class="sx-taghead">
                <span class="sx-taghash"><svg th:replace="~{fragments/icons :: i('tag','')}"></svg></span>
                <div>
                    <h1 th:text="'#' + ${tag}">#tag</h1>
                    <small class="muted" th:text="#{community.postsLongN(${postCount != null ? postCount : 0})}">0 bài viết</small>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(posts)}" class="sx-empty">
                <span class="sx-empty-ic"><svg th:replace="~{fragments/icons :: i('tag','')}"></svg></span>
                <p th:text="#{community.tag.empty}">Chưa có bài viết nào với hashtag này.</p>
            </div>
            <div id="sxFeed">
                <div th:replace="~{social/fragments :: cards(${posts})}"></div>
            </div>
            <div th:replace="~{social/fragments :: more}"></div>
        </main>
        <div th:replace="~{social/fragments :: railRight}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
