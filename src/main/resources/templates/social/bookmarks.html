<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{community.title.saved}">Đã lưu - Cộng đồng Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('bookmarks')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('bookmarks')}"></div>
        <main class="sx-main">
            <div class="sx-pagehead">
                <h1 th:text="#{community.nav.saved}">Đã lưu</h1>
                <p th:text="#{community.saved.sub}">Những bài viết bạn lưu để xem lại sau.</p>
            </div>
            <div th:if="${#lists.isEmpty(posts)}" class="sx-empty">
                <span class="sx-empty-ic"><svg th:replace="~{fragments/icons :: i('bookmark','')}"></svg></span>
                <p th:text="#{community.saved.empty}">Bạn chưa lưu bài viết nào.</p>
            </div>
            <div id="sxFeed">
                <div th:replace="~{social/fragments :: cards(${posts})}"></div>
            </div>
        </main>
        <div th:replace="~{social/fragments :: railRight}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
