<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Khám phá - Cộng đồng Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div th:replace="~{social/fragments :: tabs('explore')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('explore')}"></div>
        <main class="sx-main">
            <div class="sx-pagehead">
                <h1>Khám phá</h1>
                <p>Những chuyến đi & khoảnh khắc đang được cộng đồng quan tâm nhất.</p>
            </div>
            <div th:if="${#lists.isEmpty(posts)}" class="sx-empty">
                <span class="sx-empty-ic"><svg th:replace="~{fragments/icons :: i('sparkles','')}"></svg></span>
                <p>Chưa có bài viết công khai nào. Hãy là người <a href="/community/compose">đăng bài đầu tiên</a>!</p>
            </div>
            <div id="sxFeed">
                <div th:replace="~{social/fragments :: cards(${posts})}"></div>
            </div>
        </main>
        <div th:replace="~{social/fragments :: railRight}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
