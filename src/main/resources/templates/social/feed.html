<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{community.title.feed}">Cộng đồng - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>

    <div th:replace="~{social/fragments :: tabs('feed')}"></div>

    <div class="sx-layout">
        <div th:replace="~{social/fragments :: railLeft('feed')}"></div>
        <main class="sx-main">
            <a href="/community/compose" class="sx-composer">
                <span class="sx-ava sm">
                    <img th:if="${me.avatarUrl}" th:src="${me.avatarUrl}" alt=""/>
                    <span th:unless="${me.avatarUrl}" class="sx-ava-ph" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">D</span>
                </span>
                <span class="sx-composer-ph" th:text="#{community.feed.composerPh}">Chia sẻ chuyến đi của bạn…</span>
                <span class="sx-composer-act"><svg th:replace="~{fragments/icons :: i('image','')}"></svg></span>
                <span class="sx-composer-act"><svg th:replace="~{fragments/icons :: i('map-pin','')}"></svg></span>
            </a>

            <div th:if="${#lists.isEmpty(posts)}" class="sx-empty">
                <svg th:replace="~{fragments/icons :: i('compass','')}"></svg>
                <p th:utext="#{community.feed.empty}">Bảng tin còn trống.</p>
            </div>

            <div id="sxFeed">
                <div th:replace="~{social/fragments :: cards(${posts})}"></div>
            </div>
            <div th:replace="~{social/fragments :: more}"></div>
        </main>

        <div th:replace="~{social/fragments :: railRight}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
