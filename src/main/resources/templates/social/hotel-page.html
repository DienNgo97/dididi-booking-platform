<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${page.name} + ' - ' + #{community.brand}">Trang khách sạn</title>
    <link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>

    <div class="sx-single">
        <section class="sx-prof">
            <div class="sx-cover"></div>
            <div class="sx-phead">
                <span class="sx-ava lg hotel">
                    <svg th:replace="~{fragments/icons :: i('building','')}"></svg>
                </span>
                <div class="sx-pmeta">
                    <h1>
                        <span th:text="${page.name}">Khách sạn</span>
                        <span class="sx-badge-hotel" th:text="#{community.hotel.badge}">Trang khách sạn</span>
                    </h1>
                    <div class="sx-handle">
                        <span th:if="${page.city}" th:text="${page.city}">Thành phố</span>
                        <span th:if="${page.star != null}" th:text="' · ' + ${page.star} + ' sao'"></span>
                    </div>
                    <div class="sx-stats">
                        <span><b th:text="${page.postsCount}">0</b> <span th:text="#{community.stat.posts}">bài</span></span>
                        <span><b th:attr="data-followers='HOTEL:' + ${page.hotelId}" th:text="${page.followersCount}">0</b> <span th:text="#{community.stat.followers}">người theo dõi</span></span>
                    </div>
                </div>
                <div class="sx-pactions">
                    <button class="btn sx-follow"
                            th:classappend="${page.followState == 'ACTIVE'} ? 'is-following' : ''"
                            th:attr="data-type='HOTEL',data-id=${page.hotelId},data-state=${page.followState}">
                        <span class="sx-follow-text"
                              th:text="${page.followState == 'ACTIVE'} ? #{community.follow.following} : #{community.follow.follow}">Theo dõi</span>
                    </button>
                    <a th:href="${page.hotelUrl}" class="btn ghost" th:text="#{community.hotel.bookingPage}">Trang đặt phòng</a>
                    <a th:if="${page.canPost}" href="/community/compose" class="btn ghost" th:text="#{community.nav.compose}">Đăng bài</a>
                </div>
            </div>
        </section>

        <div th:if="${#lists.isEmpty(posts)}" class="sx-empty">
            <svg th:replace="~{fragments/icons :: i('image','')}"></svg>
            <p th:text="#{community.hotel.empty}">Khách sạn này chưa đăng bài nào.</p>
        </div>
        <div id="sxFeed">
            <div th:replace="~{social/fragments :: cards(${posts})}"></div>
        </div>
        <div th:replace="~{social/fragments :: more}"></div>
    </div>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{social/fragments :: scripts}"></div>
</body>
</html>
