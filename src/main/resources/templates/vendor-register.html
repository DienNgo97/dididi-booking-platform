<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{vendor.pageTitle}">Đăng ký bán phòng - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="authbox">
    <h1 th:text="#{auth.vendorRegister}">Đăng ký bán phòng</h1>
    <p class="muted" th:text="#{vendor.intro}">Dành cho chủ khách sạn muốn bán phòng trực tiếp trên Dididi.</p>

    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/vendor-register}" method="post">
        <h3 style="margin:14px 0 4px" th:text="#{vendor.hotelSection}">Khách sạn</h3>
        <label th:text="#{vendor.hotelNameReq}">Tên khách sạn *</label>
        <input type="text" name="hotelName" required/>
        <label th:text="#{vendor.city}">Tỉnh/Thành phố</label>
        <input type="text" name="city"/>
        <label th:text="#{vendor.addrDetail}">Địa chỉ chi tiết</label>
        <div class="vr-addr">
            <input type="text" name="houseNumber" th:placeholder="#{vendor.houseNumber}" style="flex:0 0 110px"/>
            <input type="text" name="street" th:placeholder="#{vendor.street}" style="flex:1;min-width:150px"/>
        </div>
        <div class="vr-addr" style="margin-top:8px">
            <input type="text" name="ward" th:placeholder="#{vendor.ward}" style="flex:1;min-width:150px"/>
            <!-- QA TC-C-01: BỎ ô Quận/huyện — địa chỉ VN sau sáp nhập 2025 chỉ còn Phường/Xã + Tỉnh/Thành phố
                 (backend @RequestParam district đã optional, entity giữ cột cho dữ liệu cũ). -->
        </div>

        <label th:text="#{vendor.propertyType}">Loại hình lưu trú</label>
        <select name="propertyType" style="width:100%;padding:11px;border:1px solid #d3d9e4;border-radius:10px;font-size:14px;background:#fff;box-sizing:border-box">
            <option th:each="pt : ${propertyTypes}" th:value="${pt.name()}" th:text="#{'hotel.type.' + ${pt.name()}}">Khách sạn</option>
        </select>

        <label th:text="#{vendor.amenities}">Tiện ích</label>
        <div class="vr-amenities">
            <label class="vr-amenity" th:each="am : ${amenityList}">
                <input type="checkbox" name="amenities" th:value="${am.name()}"/><span th:text="#{'hotel.amenity.' + ${am.name()}}">Tiện ích</span>
            </label>
        </div>

        <label th:text="#{vendor.pinLocation}">Ghim vị trí trên bản đồ (bấm để chọn, kéo để chỉnh)</label>
        <div id="vrMap" class="hotel-map" style="height:260px"></div>
        <input type="hidden" name="lat" id="vrLat"/>
        <input type="hidden" name="lng" id="vrLng"/>
        <p class="muted" id="vrLatLng" th:attr="data-label=#{vendor.coords}" style="font-size:12px;margin:6px 0 0"></p>

        <label th:text="#{vendor.starRating}">Hạng sao</label>
        <div class="starpick">
            <div class="stars">
                <input type="radio" id="st5" name="starRating" value="5"/><label for="st5" aria-label="5">★</label>
                <input type="radio" id="st4" name="starRating" value="4"/><label for="st4" aria-label="4">★</label>
                <input type="radio" id="st3" name="starRating" value="3" checked/><label for="st3" aria-label="3">★</label>
                <input type="radio" id="st2" name="starRating" value="2"/><label for="st2" aria-label="2">★</label>
                <input type="radio" id="st1" name="starRating" value="1"/><label for="st1" aria-label="1">★</label>
            </div>
            <b class="starpick-val">3 <span th:text="#{vendor.starUnit}">sao</span></b>
        </div>

        <h3 style="margin:18px 0 4px" th:text="#{vendor.partnerAccount}">Tài khoản đối tác</h3>
        <label th:text="#{auth.fullName}">Họ tên</label>
        <input type="text" name="fullName"/>
        <label th:text="#{vendor.phone}">Số điện thoại</label>
        <input type="text" name="phone"/>
        <label th:text="#{vendor.emailLogin}">Email * (dùng để đăng nhập &amp; nhận thông báo)</label>
        <input type="email" name="email" required/>
        <label th:text="#{vendor.passwordReq}">Mật khẩu *</label>
        <input type="password" name="password" required/>

        <div style="margin-top:18px">
            <button class="btn" type="submit" style="width:100%" th:text="#{vendor.submit}">Gửi đăng ký</button>
        </div>
    </form>
    <p class="muted" style="margin-top:14px"><span th:text="#{auth.haveAccount}">Đã có tài khoản?</span> <a href="/login" th:text="#{nav.login}">Đăng nhập</a></p>
</div>
<script>
(function () {
    var sp = document.querySelector('.starpick'); if (!sp) return;
    var box = sp.querySelector('.stars'), val = sp.querySelector('.starpick-val');
    function upd() { var c = box.querySelector('input:checked'); if (c && val && val.firstChild) val.firstChild.textContent = c.value + ' '; }
    box.addEventListener('change', upd); upd();
})();
</script>
<script th:inline="javascript">
    /* Ghim vị trí KS: Leaflet + OpenStreetMap (không cần API key). Bấm để đặt, kéo để chỉnh. */
    window.initVrMap = function () {
        var el = document.getElementById('vrMap'); if (!el || !window.L || el.__map) return;
        var map = L.map(el).setView([16.0544, 108.2022], 5);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        /* TỰ BAY TỚI TỈNH/THÀNH PHỐ VỪA GÕ (QA TC-C-01): bảng CityGeo bơm từ server — cùng
           nguồn sự thật với fallback "không ghim thì lấy tâm TP" ở backend, không gọi mạng.
           Chỉ đổi TẦM NHÌN, không tự đặt ghim — ghim vẫn là thao tác chủ đích của vendor. */
        var CITY_GEO = /*[[${cityGeoJs}]]*/ {};
        function stripVn(s) {
            return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
        }
        var cityInput = document.querySelector('input[name=city]');
        if (cityInput) {
            var flyTimer = null;
            function flyToCity() {
                var q = stripVn(cityInput.value);
                if (q.length < 2) return;
                for (var name in CITY_GEO) {
                    var k = stripVn(name);
                    if (k.indexOf(q) >= 0 || q.indexOf(k) >= 0) {
                        map.flyTo([CITY_GEO[name][0], CITY_GEO[name][1]], 13);
                        return;
                    }
                }
            }
            cityInput.addEventListener('input', function () { clearTimeout(flyTimer); flyTimer = setTimeout(flyToCity, 500); });
            cityInput.addEventListener('change', flyToCity);
        }
        var marker = null;
        function write(la, ln) {
            document.getElementById('vrLat').value = la.toFixed(6);
            document.getElementById('vrLng').value = ln.toFixed(6);
            document.getElementById('vrLatLng').textContent = ((document.getElementById('vrLatLng').getAttribute('data-label'))||'Toạ độ:') + ' ' + la.toFixed(6) + ', ' + ln.toFixed(6);
        }
        function setPin(latlng) {
            if (!marker) {
                marker = L.marker(latlng, { draggable: true }).addTo(map);
                marker.on('dragend', function () { var q = marker.getLatLng(); write(q.lat, q.lng); });
            } else marker.setLatLng(latlng);
            write(latlng.lat, latlng.lng);
        }
        map.on('click', function (e) { setPin(e.latlng); });
        el.__map = map;
    };
</script>
<th:block th:replace="~{fragments/maps :: loader('initVrMap')}"></th:block>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
