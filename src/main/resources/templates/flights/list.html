<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{flights.pageTitle}">Chuyến bay - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <div class="search-full"><div th:replace="~{fragments/search :: widget('flight')}"></div></div>
    <div class="search-mini" id="searchMini">
        <div class="smini-bar">
        <a class="smini-brand" href="/">Dididi</a>
        <div class="smini-pill">
            <span class="smini-seg"><b><svg th:replace="~{fragments/icons :: i('plane','')}"></svg> <span th:text="(${from != null and !#strings.isEmpty(from)} ? ${from} : #{flights.anywhere}) + ' → ' + (${to != null and !#strings.isEmpty(to)} ? ${to} : #{flights.anywhere})">HAN → SGN</span></b></span>
            <span class="smini-div"></span>
            <span class="smini-seg grow" th:text="${date != null} ? ${date} : #{flights.anyDay}">2026-07-01</span>
            <span class="smini-div opt"></span>
            <!-- Trước đây in cứng "Vietnam Airlines" ở đây — vô nghĩa vì thanh này tóm tắt ĐIỀU KIỆN TÌM,
                 không phải hãng bay. Đổi thành số khách đang tìm. -->
            <span class="smini-seg opt" th:text="${(passengers != null ? passengers : 1) + ' ' + #messages.msg('flights.passengerShort')}">1 khách</span>
            <button type="button" class="smini-go" aria-label="Tìm" th:attr="aria-label=#{flights.search}"><svg th:replace="~{fragments/icons :: i('search','')}"></svg></button>
        </div>
        </div>
    </div>
    <h1><span th:text="#{flights.title}">Chuyến bay</span>
        <span class="muted" style="font-size:15px;font-weight:400" th:if="${total != null}" th:text="'· ' + ${#numbers.formatInteger(total,1,'COMMA')}">· 0</span></h1>
    <!-- PHÂN TRANG SERVER: chỉ render 20 chuyến/trang (xem PERFORMANCE.md) — bỏ client paginate cũ -->
    <div>
    <div class="fcard" th:each="f : ${flights}">
        <a class="fcard-stretch" th:aria-label="${f.airlineCode + ' ' + f.flightNumber}"
           th:href="@{/booking/flight/{id}(id=${f.id},cabin=${cabin})}"></a>
        <div class="fcard-airline">
            <div class="fcard-logo"><svg th:replace="~{fragments/icons :: i('plane','')}"></svg></div>
            <div><b th:text="${f.airlineCode}">VN</b> <span class="muted" th:text="${f.flightNumber}"></span>
                <!-- Tra tên hãng theo mã IATA. Trước đây in cứng "Vietnam Airlines" cho mọi chuyến. -->
                <div class="muted" style="font-size:11px"
                     th:text="${T(com.dididi.booking.flight.domain.Airlines).nameOf(f.airlineCode)}">Vietnam Airlines</div></div>
        </div>
        <div class="fcard-route">
            <div class="fcard-pt"><b th:text="${f.fromAirport}">HAN</b></div>
            <div class="fcard-line"></div>
            <div class="fcard-pt"><b th:text="${f.toAirport}">SGN</b></div>
        </div>
        <div class="fcard-mid">
            <div class="muted" style="font-size:12.5px" th:text="${f.departureTime}"></div>
            <div class="muted" style="font-size:12px"><span th:text="${f.availableSeats}"></span> <span th:text="#{flights.seatsLeft}">ghế</span></div>
        </div>
        <div class="fcard-aside">
            <div class="price">
                <span th:text="${f.price != null ? #numbers.formatInteger(f.price,1,'COMMA') : ''}"></span>
                <span th:text="${f.currency}"></span>
            </div>
            <a class="btn" th:href="@{/booking/flight/{id}(id=${f.id},cabin=${cabin})}" th:text="#{flights.book}">Chọn</a>
        </div>
    </div>
    </div>
    <p class="muted" th:if="${#lists.isEmpty(flights)}" th:text="#{flights.empty}">Không có chuyến bay.</p>

    <!-- Pager server: link giữ nguyên bộ lọc from/to/date/cabin -->
    <nav class="pager" th:if="${totalPages != null and totalPages > 1}">
        <a th:href="@{/flights(from=${from},to=${to},date=${date},cabin=${cabin},page=${curPage - 1})}"
           th:classappend="${curPage == 1} ? 'is-disabled'">‹</a>
        <th:block th:each="p : ${pageItems}">
            <span class="gap" th:if="${p == -1}">…</span>
            <a th:if="${p != -1}"
               th:href="@{/flights(from=${from},to=${to},date=${date},cabin=${cabin},page=${p})}"
               th:classappend="${p == curPage} ? 'is-active'" th:text="${p}">1</a>
        </th:block>
        <a th:href="@{/flights(from=${from},to=${to},date=${date},cabin=${cabin},page=${curPage + 1})}"
           th:classappend="${curPage == totalPages} ? 'is-disabled'">›</a>
    </nav>
</div>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
