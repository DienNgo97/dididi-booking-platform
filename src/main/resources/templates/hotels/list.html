<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{hotels.pageTitle}">Khách sạn - Dididi</title><link rel="stylesheet" href="/css/site.css"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="wrap">
    <div class="search-full"><div th:replace="~{fragments/search :: widget('hotel')}"></div></div>
    <div class="search-mini" id="searchMini">
        <div class="smini-bar">
        <a class="smini-brand" href="/">Dididi</a>
        <div class="smini-pill">
            <span class="smini-seg"><b><svg th:replace="~{fragments/icons :: i('building','')}"></svg> <span th:text="${city != null and !#strings.isEmpty(city)} ? ${city} : #{hotels.anyDest}">Hà Nội</span></b></span>
            <span class="smini-div"></span>
            <span class="smini-seg grow" th:text="${checkIn != null and !#strings.isEmpty(checkIn) ? (checkIn + (checkOut != null and !#strings.isEmpty(checkOut) ? ' → ' + checkOut : '')) : null} ?: #{hotels.pickDate}">Chọn ngày</span>
            <span class="smini-div opt"></span>
            <span class="smini-seg opt" th:text="${(adults != null ? adults : 2)} + ' ' + #{search.adultsUnit} + ' · ' + ${(rooms != null ? rooms : 1)} + ' ' + #{search.roomsUnit}">2 người lớn · 1 phòng</span>
            <button type="button" class="smini-go" aria-label="Tìm" th:attr="aria-label=#{flights.search}"><svg th:replace="~{fragments/icons :: i('search','')}"></svg></button>
        </div>
        </div>
    </div>
    <div class="hsearch-layout">
    <aside class="hfilter">
        <form class="hfilter-form" id="hfilterForm" onsubmit="return false">
            <div class="hf-head"><b>Bộ lọc</b><button type="button" class="hf-clear" id="hfClear">Xoá lọc</button></div>

            <div class="hf-sec">
                <div class="hf-title">Giá mỗi đêm (đ)</div>
                <div class="hf-price">
                    <input type="number" name="priceMin" min="0" step="100000" placeholder="Tối thiểu" th:value="${fPriceMin}"/>
                    <span>–</span>
                    <input type="number" name="priceMax" min="0" step="100000" placeholder="Tối đa" th:value="${fPriceMax}"/>
                </div>
            </div>

            <div class="hf-sec">
                <div class="hf-title">Hạng sao</div>
                <label class="hf-opt" th:each="s : ${ {5,4,3} }">
                    <input type="checkbox" name="stars" th:value="${s}" th:checked="${fStars.contains(s)}"/>
                    <span th:text="${s} + ' sao'">5 sao</span>
                </label>
            </div>

            <div class="hf-sec">
                <div class="hf-title">Điểm đánh giá</div>
                <label class="hf-opt"><input type="radio" name="minRating" value="4.5" th:checked="${fMinRating != null and fMinRating == 4.5}"/> <span>Từ 4.5 ★</span></label>
                <label class="hf-opt"><input type="radio" name="minRating" value="4"   th:checked="${fMinRating != null and fMinRating == 4}"/> <span>Từ 4.0 ★</span></label>
                <label class="hf-opt"><input type="radio" name="minRating" value="3.5" th:checked="${fMinRating != null and fMinRating == 3.5}"/> <span>Từ 3.5 ★</span></label>
                <label class="hf-opt"><input type="radio" name="minRating" value=""    th:checked="${fMinRating == null}"/> <span>Tất cả</span></label>
            </div>

            <div class="hf-sec">
                <div class="hf-title">Loại chỗ ở</div>
                <label class="hf-opt" th:each="t : ${allTypes}">
                    <input type="checkbox" name="types" th:value="${t.name()}" th:checked="${fTypes.contains(t.name())}"/>
                    <span th:text="${t.viName}">Khách sạn</span>
                </label>
            </div>

            <div class="hf-sec">
                <div class="hf-title">Nổi bật</div>
                <label class="hf-opt" th:each="t : ${allTags}">
                    <input type="checkbox" name="tags" th:value="${t.name()}" th:checked="${fTags.contains(t.name())}"/>
                    <span th:text="${t.viName}">Sát biển</span>
                </label>
            </div>

            <div class="hf-sec">
                <div class="hf-title">Tiện nghi</div>
                <label class="hf-opt" th:each="a : ${allAmenities}">
                    <input type="checkbox" name="amenities" th:value="${a.name()}" th:checked="${fAmenities.contains(a.name())}"/>
                    <span th:text="${a.viName}">Wifi</span>
                </label>
            </div>

            <p class="hf-hint">Bộ lọc áp dụng ngay khi bạn chọn — không cần tải lại trang.</p>
        </form>
    </aside>
    <div class="hresults">
    <h1><span th:text="#{hotels.title}">Khách sạn</span><span class="muted" th:if="${city}"> · <span th:text="${city}"></span></span></h1>
    <div class="hresult-bar">
        <span class="hresult-count"><b id="hcount">…</b> chỗ ở</span>
        <label class="hresult-sort">Sắp xếp:
            <select id="hsort">
                <option value=""           th:selected="${fSort == null or fSort == ''}">Đề xuất</option>
                <option value="price_asc"  th:selected="${fSort == 'price_asc'}">Giá: thấp → cao</option>
                <option value="price_desc" th:selected="${fSort == 'price_desc'}">Giá: cao → thấp</option>
                <option value="rating_desc"th:selected="${fSort == 'rating_desc'}">Đánh giá cao nhất</option>
                <option value="stars_desc" th:selected="${fSort == 'stars_desc'}">Hạng sao cao nhất</option>
            </select>
        </label>
    </div>
    <div class="map-wrap">
        <div class="map-bar">
            <button type="button" class="btn ghost" id="toggleMap"><svg th:replace="~{fragments/icons :: i('map-pin','')}"></svg>
                <span data-show th:text="#{maps.showMap}">Xem bản đồ</span><span data-hide hidden th:text="#{maps.hideMap}">Ẩn bản đồ</span></button>
            <button type="button" class="btn ghost" id="nearMe"><svg th:replace="~{fragments/icons :: i('map-pin','')}"></svg> <span th:text="#{maps.nearMe}">Khách sạn gần tôi</span></button>
        </div>
        <div id="hotelsMap" class="hotel-map hotel-map-lg" style="display:none"></div>
    </div>
    <!-- Card do CLIENT render từ GET /hotels/data (JSON phân trang server) — xem script bên dưới -->
    <div class="hlist" id="hlist"></div>
    <nav class="pager" id="hpager"></nav>
    <p class="muted" id="hempty" style="display:none" th:text="#{hotels.empty}">Không có khách sạn phù hợp.</p>
    <p class="muted" id="hloading" style="display:none">Đang tải…</p>
    </div><!-- /.hresults -->
    </div><!-- /.hsearch-layout -->
</div>

<script sec:authorize="isAuthenticated()">window.DD_AUTH = true;</script>
<script th:inline="javascript">
    window.DD_MAPS_T = {
        detail: /*[[#{maps.viewDetail}]]*/ 'Xem chi tiết',
        night: /*[[#{hotels.perNight}]]*/ '/ đêm'
    };
    window.DD_HL_T = {
        starsUnit: /*[[#{hotels.starsUnit}]]*/ 'sao',
        instant: /*[[#{hotels.instantConfirm}]]*/ 'Xác nhận tức thì',
        payOnline: /*[[#{hotels.payOnline}]]*/ 'Thanh toán online',
        ratingLabel: /*[[#{hotels.ratingLabel}]]*/ 'Đánh giá',
        outOf5: /*[[#{hotels.outOf5}]]*/ 'trên 5',
        noRating: /*[[#{hotels.noRating}]]*/ 'Chưa có đánh giá',
        perNight: /*[[#{hotels.perNight}]]*/ '/ đêm',
        view: /*[[#{hotels.view}]]*/ 'Xem chỗ trống',
        imgAlt: /*[[#{home.hotelImgAlt}]]*/ 'ảnh khách sạn',
        wishlist: /*[[#{nav.wishlist}]]*/ 'Yêu thích'
    };
</script>
<script>
/* ============================================================================
   /hotels — TỐI ƯU HIỆU NĂNG: phân trang + lọc + sắp xếp PHÍA SERVER qua AJAX.
   Trước: server render TOÀN BỘ ~1.800 thẻ (~3,6s + HTML nặng), client lọc DOM.
   Sau  : trang HTML nhẹ; client fetch /hotels/data (JSON ~20 KS/lần, debounce 300ms)
          -> tải trang gần tức thì, đếm tổng vẫn đúng trên toàn bộ dữ liệu,
          scale được tới hàng trăm nghìn KS. Bản đồ lấy toạ độ theo đúng bộ lọc.
   ========================================================================== */
(function () {
    var form = document.getElementById('hfilterForm');
    var box = document.getElementById('hlist');
    if (!form || !box) return;
    var T = window.DD_HL_T, AUTH = !!window.DD_AUTH;
    var sortSel = document.getElementById('hsort');
    var countEl = document.getElementById('hcount');
    var emptyEl = document.getElementById('hempty');
    var loadEl = document.getElementById('hloading');
    var pager = document.getElementById('hpager');
    var SIZE = 20, cur = 1, total = 0, reqSeq = 0;

    // Ngữ cảnh tìm kiếm ban đầu (giữ cho link chi tiết + URL chia sẻ — fix M4: không mất keyword/ngày)
    var init = new URLSearchParams(location.search);
    var CTX = {};
    ['keyword', 'city', 'stay', 'checkIn', 'checkOut', 'adults', 'children', 'rooms', 'trip'].forEach(function (k) {
        var v = init.get(k); if (v) CTX[k] = v;
    });

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function num(v) { v = parseFloat(v); return isNaN(v) ? null : v; }
    function checked(name) { return Array.prototype.map.call(form.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; }); }
    function radio(name) { var el = form.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; }
    function field(name) { var el = form.querySelector('[name="' + name + '"]'); return el ? el.value : ''; }

    function filterParams() {
        var p = new URLSearchParams();
        if (CTX.keyword) p.set('keyword', CTX.keyword);
        else if (CTX.city) p.set('city', CTX.city);
        if (field('priceMin')) p.set('priceMin', field('priceMin'));
        if (field('priceMax')) p.set('priceMax', field('priceMax'));
        checked('stars').forEach(function (v) { p.append('stars', v); });
        checked('types').forEach(function (v) { p.append('types', v); });
        checked('tags').forEach(function (v) { p.append('tags', v); });
        checked('amenities').forEach(function (v) { p.append('amenities', v); });
        var mr = radio('minRating'); if (mr) p.set('minRating', mr);
        if (sortSel && sortSel.value) p.set('sort', sortSel.value);
        return p;
    }

    function detailUrl(id) {
        var p = new URLSearchParams();
        ['stay', 'checkIn', 'checkOut', 'adults', 'children', 'rooms', 'trip'].forEach(function (k) {
            if (CTX[k]) p.set(k, CTX[k]);
        });
        var qs = p.toString();
        return '/hotels/' + id + (qs ? ('?' + qs) : '');
    }

    function cardHtml(h) {
        var url = detailUrl(h.id);
        var img = h.cover
            ? '<img src="' + esc(h.cover) + '" alt="' + esc(T.imgAlt) + '"/>'
            : '<div class="ph"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-building"></use></svg></div>';
        var heart = AUTH
            ? '<form class="hcard-heart" data-hotel="' + h.id + '"><button type="submit" class="wish-btn' + (h.wishlisted ? ' is-on' : '') + '" title="' + esc(T.wishlist) + '">'
              + '<svg class="ic' + (h.wishlisted ? ' ic-fill' : '') + '" viewBox="0 0 24 24"><use href="#ic-heart"></use></svg></button></form>'
            : '';
        var rate = (h.rating && h.rating > 0)
            ? '<div class="rate"><div class="lab"><b>' + esc(T.ratingLabel) + '</b><small>' + esc(T.outOf5) + '</small></div><span class="score">' + h.rating.toFixed(1) + '</span></div>'
            : '<div class="muted" style="font-size:12px">' + esc(T.noRating) + '</div>';
        var price = h.price != null
            ? '<span class="amt">' + Number(h.price).toLocaleString('vi-VN') + 'đ</span><small>' + esc(T.perNight) + '</small>'
            : '';
        return '<div class="hcard">'
            + '<a class="hcard-stretch" aria-label="' + esc(h.name) + '" href="' + url + '"></a>'
            + '<div class="hcard-img">' + img + heart + '</div>'
            + '<div class="hcard-body">'
            +   '<h3><a href="' + url + '">' + esc(h.name) + '</a></h3>'
            +   '<div class="hcard-loc"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-map-pin"></use></svg> <span>' + esc(h.city) + '</span> · <span>' + esc(h.address) + '</span></div>'
            +   '<div class="chips">'
            +     (h.star ? '<span class="chip">' + h.star + ' ' + esc(T.starsUnit) + '</span>' : '')
            +     '<span class="chip">' + esc(T.instant) + '</span><span class="chip">' + esc(T.payOnline) + '</span>'
            +   '</div>'
            + '</div>'
            + '<div class="hcard-aside">' + rate
            +   '<div class="hcard-price">' + price
            +     '<a class="btn" style="margin-top:8px;width:100%" href="' + url + '">' + esc(T.view) + '</a>'
            +   '</div>'
            + '</div>'
            + '</div>';
    }

    // ---- Pager (server-driven) ----
    function pgList(c, t) { var r = [], i; if (t <= 7) { for (i = 1; i <= t; i++) r.push(i); return r; } r.push(1); var s = Math.max(2, c - 1), e = Math.min(t - 1, c + 1); if (s > 2) r.push('…'); for (i = s; i <= e; i++) r.push(i); if (e < t - 1) r.push('…'); r.push(t); return r; }
    function drawPager() {
        var pages = Math.ceil(total / SIZE); pager.innerHTML = ''; if (pages <= 1) return;
        function add(label, page, o) { o = o || {}; if (label === '…') { var gp = document.createElement('span'); gp.className = 'gap'; gp.textContent = '…'; pager.appendChild(gp); return; } var b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (o.active) b.className = 'is-active'; if (o.disabled) b.disabled = true; if (!o.disabled && !o.active) b.addEventListener('click', function () { load(page, true); }); pager.appendChild(b); }
        add('‹', cur - 1, { disabled: cur === 1 });
        pgList(cur, pages).forEach(function (n) { add(n, n, { active: n === cur }); });
        add('›', cur + 1, { disabled: cur === pages });
    }

    function syncUrl() {
        var p = filterParams();
        ['stay', 'checkIn', 'checkOut', 'adults', 'children', 'rooms', 'trip'].forEach(function (k) {
            if (CTX[k]) p.set(k, CTX[k]);
        });
        if (cur > 1) p.set('page', cur);
        var qs = p.toString();
        history.replaceState(null, '', '/hotels' + (qs ? ('?' + qs) : ''));
    }

    // ---- Gọi server (chống race: chỉ nhận response của lượt gọi mới nhất) ----
    function load(page, scroll) {
        cur = Math.max(1, page || 1);
        var p = filterParams();
        p.set('page', cur); p.set('size', SIZE);
        if (mapOpen()) p.set('geo', 'true');
        var seq = ++reqSeq;
        if (loadEl) loadEl.style.display = '';
        fetch('/hotels/data?' + p.toString(), { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (seq !== reqSeq) return;                  // đã có lượt gọi mới hơn
                if (loadEl) loadEl.style.display = 'none';
                total = d.total || 0;
                if (countEl) countEl.textContent = total.toLocaleString('vi-VN');
                if (emptyEl) emptyEl.style.display = total ? 'none' : '';
                box.innerHTML = (d.items || []).map(cardHtml).join('');
                drawPager();
                syncUrl();
                if (d.geo) updateMap(d.geo);
                if (scroll) { var y = box.getBoundingClientRect().top + window.pageYOffset - 130; window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); }
            })
            .catch(function () { if (loadEl) loadEl.style.display = 'none'; });
    }

    // ---- Wishlist (uỷ quyền sự kiện vì card render lại liên tục) ----
    var csrf = document.querySelector('meta[name=_csrf]'), csrfH = document.querySelector('meta[name=_csrf_header]');
    box.addEventListener('submit', function (e) {
        var f = e.target.closest('form.hcard-heart'); if (!f) return;
        e.preventDefault();
        var btn = f.querySelector('button'); if (!btn || btn.disabled) return;
        btn.disabled = true;
        var h = { 'Content-Type': 'application/x-www-form-urlencoded' };
        if (csrf && csrf.content && csrfH && csrfH.content) h[csrfH.content] = csrf.content;
        fetch('/account/wishlist/toggle-ajax', { method: 'POST', headers: h, credentials: 'same-origin',
            body: 'hotelId=' + encodeURIComponent(f.getAttribute('data-hotel')) })
            .then(function (r) { if (r.status === 401 || r.status === 403) { window.location = '/login'; return null; } return r.json(); })
            .then(function (d) {
                if (!d) return;
                btn.innerHTML = d.wishlisted ? '<svg class="ic ic-fill" viewBox="0 0 24 24"><use href="#ic-heart"></use></svg>' : '<svg class="ic" viewBox="0 0 24 24"><use href="#ic-heart"></use></svg>';
                btn.classList.toggle('is-on', !!d.wishlisted);
                btn.disabled = false;
            })
            .catch(function () { btn.disabled = false; });
    });

    // ---- Bản đồ Leaflet: markers theo ĐÚNG bộ lọc hiện tại (geo từ /hotels/data) ----
    var toggle = document.getElementById('toggleMap'), near = document.getElementById('nearMe'), mapEl = document.getElementById('hotelsMap');
    var map = null, markerLayer = null, leafletLoading = false;
    function mapOpen() { return mapEl && mapEl.style.display !== 'none' && mapEl.style.display !== ''; }
    function openMap(show) {
        mapEl.style.display = show ? 'block' : 'none';
        toggle.querySelectorAll('[data-show]').forEach(function (x) { x.hidden = show; });
        toggle.querySelectorAll('[data-hide]').forEach(function (x) { x.hidden = !show; });
    }
    function ensureLeaflet(cb) {
        if (window.L) { if (cb) cb(); return; }
        if (leafletLoading) return; leafletLoading = true;
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(l);
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
        s.onload = function () { if (cb) cb(); };
        document.head.appendChild(s);
    }
    function buildMap() {
        if (map || !window.L) return;
        map = L.map(mapEl).setView([16.05, 108.2], 6);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        markerLayer = L.layerGroup().addTo(map);
        window.__hotelsMap = map;
    }
    function updateMap(geo) {
        if (!window.L) return;
        buildMap();
        if (!markerLayer) return;
        markerLayer.clearLayers();
        var pts = [];
        (geo || []).forEach(function (h) {
            var m = L.marker([h.lat, h.lng], { title: h.name }).addTo(markerLayer);
            pts.push([h.lat, h.lng]);
            var price = h.price ? Number(h.price).toLocaleString('vi-VN') + 'đ ' + window.DD_MAPS_T.night : '';
            m.bindPopup('<div style="min-width:170px;font-size:13px"><b>' + esc(h.name) + '</b><br>' + (h.star ? ('★ ' + h.star + ' · ') : '') + price + '<br><a href="/hotels/' + h.id + '">' + window.DD_MAPS_T.detail + ' →</a></div>');
        });
        if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 14 });
    }
    if (toggle) toggle.addEventListener('click', function () {
        var show = !mapOpen();
        openMap(show);
        if (show) ensureLeaflet(function () {
            buildMap();
            setTimeout(function () { map.invalidateSize(); }, 60);
            load(cur, false);                                  // nạp geo theo bộ lọc hiện tại
        });
    });
    if (near) near.addEventListener('click', function () {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(function (p) {
            openMap(true);
            ensureLeaflet(function () {
                buildMap();
                setTimeout(function () { map.invalidateSize(); }, 60);
                load(cur, false);
                var lat = p.coords.latitude, lng = p.coords.longitude;
                L.circleMarker([lat, lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2f8b60', fillOpacity: 1 })
                    .addTo(map).bindPopup('Vị trí của bạn');
                map.setView([lat, lng], 13);
            });
        });
    });

    // ---- Sự kiện bộ lọc: debounce 300ms, luôn quay về trang 1 ----
    var deb;
    function refilter() { clearTimeout(deb); deb = setTimeout(function () { load(1, false); }, 300); }
    form.addEventListener('change', refilter);
    form.addEventListener('input', function (e) { if (e.target && e.target.type === 'number') refilter(); });
    if (sortSel) sortSel.addEventListener('change', function () { load(1, false); });
    var clr = document.getElementById('hfClear');
    if (clr) clr.addEventListener('click', function () {
        form.querySelectorAll('input[type=checkbox]').forEach(function (i) { i.checked = false; });
        var all = form.querySelector('input[name=minRating][value=""]'); if (all) all.checked = true;
        var pn = form.querySelector('[name=priceMin]'); if (pn) pn.value = '';
        var px = form.querySelector('[name=priceMax]'); if (px) px.value = '';
        if (sortSel) sortSel.value = '';
        load(1, false);
    });

    load(parseInt(init.get('page') || '1', 10), false);   // lần đầu — tôn trọng trạng thái form + trang từ URL
})();
</script>
<div th:replace="~{fragments/site :: footer}"></div>
</body>
</html>
