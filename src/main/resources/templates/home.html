<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{home.pageTitle}">Dididi</title>
    <link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
<div th:replace="~{fragments/site :: nav}"></div>
<div class="hero">
    <div style="max-width:1008px;margin:0 auto">
        <h1 th:text="#{home.heroTitle}">Đặt phòng & vé máy bay cùng Dididi</h1>
        <p th:text="#{home.heroSubtitle}">Chọn điểm đến, để chúng tôi lo phần còn lại.</p>
    </div>
    <form class="searchbox" action="/hotels" method="get">
        <div><label th:text="#{home.city}">Thành phố</label><input type="text" name="city" th:placeholder="#{common.cityExample}" placeholder="VD: Da Nang"/></div>
        <div><label th:text="#{home.checkin}">Nhận phòng</label><input type="date"/></div>
        <div><label th:text="#{home.checkout}">Trả phòng</label><input type="date"/></div>
        <button class="btn" type="submit" th:text="#{home.searchHotels}">Tìm khách sạn</button>
    </form>
</div>
<div class="wrap">
    <div th:replace="~{fragments/site :: flash}"></div>
    <h2 th:text="#{home.featured}">Khách sạn nổi bật</h2>
    <div class="grid">
        <div class="card" th:each="h : ${featured}">
            <h3><a th:href="@{'/hotels/' + ${h.id}}" th:text="${h.name}">Hotel</a></h3>
            <div class="muted"><span th:text="${h.city}"></span> ·
                <span class="stars" th:if="${h.starRating != null}" th:text="${h.starRating + '★'}"></span></div>
            <p class="muted" th:text="${h.description}"></p>
        </div>
        <p class="muted" th:if="${#lists.isEmpty(featured)}" th:text="#{home.empty}">Chưa có khách sạn.</p>
    </div>
</div>
</body>
</html>
